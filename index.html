<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>늑대게임</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#eee;font-family:"Noto Sans KR",sans-serif}body{background:radial-gradient(circle at 50% 0,#250005,#050505 45%,#000)}
.wrap{max-width:620px;margin:auto;min-height:100vh;background:#030303;box-shadow:0 0 80px #50000055}
header{text-align:center;padding:10px;border-bottom:1px solid #350006}.title{display:block;width:min(440px,95%);height:110px;object-fit:cover;object-position:center 20%;margin:auto}.sub{font-size:10px;color:#777;letter-spacing:3px}
main{padding:18px}.screen{display:none}.active{display:block}.card{background:#0b0b0b;border:1px solid #292929;border-radius:12px;padding:16px;margin-bottom:13px;box-shadow:inset 0 0 20px #000}
h1{font-family:Cinzel,"Noto Sans KR";margin:0 0 8px;text-shadow:0 0 12px red}.muted{color:#999;font-size:13px;line-height:1.6}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
button{border:1px solid #85000b;border-radius:8px;padding:11px 13px;background:linear-gradient(#d20c18,#6c0005);color:#fff;font-weight:900}button.secondary{background:#171717;border-color:#444}button.danger{background:#4a0005}button.success{background:#075a2d;border-color:#18a45a}button:disabled{opacity:.35}
input,textarea,select{width:100%;padding:12px;background:#050505;border:1px solid #3c3c3c;border-radius:8px;color:#fff;margin:7px 0 12px}.item{padding:12px 0;border-bottom:1px solid #222}.item:last-child{border:0}.mission{display:flex;justify-content:space-between;align-items:center}
.notice{padding:14px;background:#171717;border-left:3px solid #aaa;margin-bottom:12px;border-radius:8px}.alert{background:#390006;border-color:#f00}.success{background:#05351b;border-color:#1bc268}.timer{text-align:center;font-size:32px;font-weight:900;font-family:Cinzel}.dangerText{color:#f33}.question{font-size:19px;line-height:1.6;margin:15px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#151515;padding:11px;border-radius:8px}.stat b{display:block;font-size:20px;margin-top:4px}
.overlay{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.overlay.show{display:flex}.modal{width:min(500px,100%);background:#050505;border:1px solid #c0000d;padding:28px;border-radius:14px;text-align:center;box-shadow:0 0 80px #f0000066}.win .modal{border-color:#d9ae45;box-shadow:0 0 80px #d9ae4544}.icon{font-size:55px}
</style></head><body><div class="wrap">
<header><img class="title" src="wolf_game_title.png" alt="늑대게임"><div class="sub">REAL-WORLD SURVIVAL GAME</div></header>
<main>
<section id="login" class="screen active"><div class="card"><h1>게임 입장</h1><p class="muted">이름을 입력하십시오. <b>관리자</b> 입력 시 관리자 화면으로 입장합니다.</p><input id="name" placeholder="성명"><button style="width:100%" onclick="join()">입장</button></div></section>
<section id="lobby" class="screen"><div class="card"><div class="row"><h1>대기실</h1><span id="role"></span></div><div id="lobbyNotice" class="notice"></div><div id="roleText" class="muted"></div></div></section>
<section id="player" class="screen"><div id="noticeBox"></div><div class="card"><div class="row"><h1 id="state">양 생존 중...</h1><span id="round"></span></div><p id="phase" class="muted"></p></div><div id="awaken"></div><div class="card"><h2>미션</h2><p class="muted">전체 완료 현황은 공개되지 않습니다.</p><div id="missions"></div></div><button style="width:100%" onclick="confirmBody()">☠️ 시체 발견</button><br><br><button class="secondary" style="width:100%" onclick="enableSound()">🔊 알림 소리 테스트</button></section>
<section id="mission" class="screen"><button class="secondary" onclick="renderPlayer()">← 돌아가기</button><div class="card"><div id="meta" class="muted"></div><h1 id="mt"></h1><p id="md" class="muted"></p><div id="timer" class="timer">03:00</div><div id="q" class="question"></div><input id="ans" placeholder="답 입력"><button style="width:100%" onclick="submitAnswer()">답안 제출</button><div id="mr"></div></div></section>
<section id="admin" class="screen"><div class="card"><h1>관리자 대시보드</h1><div id="stats" class="grid"></div></div>
<div class="card"><h2>게임 제어</h2><div class="grid"><button onclick="startGame()">게임 시작</button><button onclick="nextRound()">다음 라운드</button><button onclick="trial()">재판 시작</button><button onclick="resetGame()">게임 초기화</button><button class="success" onclick="forceWin('SHEEP')">🐑 양 승리</button><button class="danger" onclick="forceWin('WOLF')">🐺 늑대 승리</button></div></div>
<div class="card"><h2>시간 설정</h2><label class="muted">라운드 진행 시간</label><select id="roundMin"><option>10</option><option selected>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select><label class="muted">양 제한 시간</label><select id="sheepMin"><option>5</option><option selected>8</option><option>10</option><option>12</option><option>15</option></select><button onclick="saveTiming()">저장</button></div>
<div class="card"><h2>NFC 테스트</h2><p class="muted">OFF면 실제 NFC 없이 미션을 테스트할 수 있습니다.</p><button id="nfcBtn" onclick="toggleNfc()">NFC 모드: OFF</button></div>
<div class="card"><h2>전체 알림</h2><textarea id="msg" placeholder="메시지"></textarea><button onclick="sendNotice()">전송</button></div>
<div class="card"><h2>플레이어</h2><div id="plist"></div></div></section>
</main></div>
<div id="overlay" class="overlay"><div class="modal"><div id="oi" class="icon">🔔</div><h1 id="ot"></h1><p id="om" class="muted"></p><button id="ob" onclick="closeOverlay()">확인</button></div></div>
<script>
const URL="https://nfmryuvkdiiqxznhhcjg.supabase.co",KEY="sb_publishable_HbU7dNOMplBEY3qLgaW8HQ_PzeWoR2u",db=supabase.createClient(URL,KEY);
let meId=localStorage.getItem("wg_player"),timer=null,endAt=0,current=null,sound=false,nfc=false,lastNotice="";
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active")}
async function settings(){return (await db.from("game_settings").select("*").eq("id",1).single()).data}
async function me(){return meId?(await db.from("players").select("*").eq("id",meId).maybeSingle()).data:null}
async function missions(){return (await db.from("missions").select("*").eq("active",true).order("id")).data||[]}
async function comps(r){return (await db.from("mission_completions").select("*").eq("game_round",r)).data||[]}
function beep(type="normal"){try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.1;if(type==="siren"){o.type="sawtooth";o.frequency.setValueAtTime(450,c.currentTime);o.frequency.linearRampToValueAtTime(1000,c.currentTime+.35);o.frequency.linearRampToValueAtTime(400,c.currentTime+.7);o.start();o.stop(c.currentTime+.9)}else if(type==="win"){o.type="triangle";o.frequency.value=880;o.start();o.stop(c.currentTime+.6)}else{o.frequency.value=700;o.start();o.stop(c.currentTime+.18)}}catch(e){}}
function enableSound(){sound=true;beep();alert("알림 소리가 활성화되었습니다.")}
function overlay(icon,title,msg,kind="",confirm=false){document.getElementById("oi").textContent=icon;document.getElementById("ot").textContent=title;document.getElementById("om").textContent=msg;document.getElementById("ob").textContent=confirm?"신고하기":"확인";document.getElementById("ob").onclick=confirm?bodyFound:closeOverlay;let x=document.getElementById("overlay");x.className="overlay show "+kind;if(kind==="win")beep("win");else if(kind==="alarm")beep("siren");else if(sound)beep()}
function closeOverlay(){document.getElementById("overlay").className="overlay"}
async function join(){let n=document.getElementById("name").value.trim();if(!n)return alert("이름을 입력하세요.");if(n==="관리자"){localStorage.setItem("wg_admin","1");show("admin");renderAdmin();return}let p=(await db.from("players").select("*").eq("name",n).maybeSingle()).data;if(!p){let r=await db.from("players").insert({name:n}).select().single();if(r.error)return alert(r.error.message);p=r.data}meId=p.id;localStorage.setItem("wg_player",meId);sound=true;beep();route()}
async function route(){if(localStorage.getItem("wg_admin")==="1"){show("admin");renderAdmin();return}let p=await me(),g=await settings();if(!p)return show("login");if(g.started)renderPlayer();else{document.getElementById("role").textContent=p.role==="WOLF"?"🐺 늑대":p.role==="SHEEP"?"🐑 양":"역할 대기";document.getElementById("roleText").textContent=p.role==="WOLF"?"당신은 늑대입니다.":p.role==="SHEEP"?"당신은 양입니다.":"게임 시작을 기다리십시오.";document.getElementById("lobbyNotice").textContent=g.notice||"게임 시작을 기다리고 있습니다.";show("lobby")}}
async function renderPlayer(){let p=await me(),g=await settings(),ms=await missions(),cs=await comps(g.current_round);if(!p)return show("login");document.getElementById("state").textContent=p.status==="ALIVE"?"양 생존 중...":"☠️ 탈락";document.getElementById("round").textContent="ROUND "+g.current_round;document.getElementById("phase").textContent=g.notice||g.phase;document.getElementById("noticeBox").innerHTML=g.notice?`<div class="notice">${g.notice}</div>`:"";document.getElementById("awaken").innerHTML=g.wolf_awakened?'<div class="notice alert"><b>🐺 늑대가 각성했다</b><br>양의 제한 시간 초과로 늑대에게 어드밴티지가 적용되었습니다.</div>':"";let mine=cs.some(x=>x.player_id===p.id),b=document.getElementById("missions");b.innerHTML="";ms.forEach(m=>{let own=cs.some(x=>x.player_id===p.id&&x.mission_id===m.id);let dis=mine||own||p.status!=="ALIVE"||(!nfc);b.innerHTML+=`<div class="item mission"><div><b>${m.location}</b><div class="muted">${m.title}</div></div><button ${dis?"disabled":""} onclick="openMission('${m.id}')">${own?"완료":"수행"}</button></div>`});show("player")}
async function openMission(id){let p=await me(),g=await settings(),ms=await missions(),m=ms.find(x=>x.id===id);if(!m)return;let cs=await comps(g.current_round);if(p.role==="SHEEP"&&cs.some(x=>x.player_id===p.id))return alert("이미 미션을 완료했습니다.");current=m;document.getElementById("meta").textContent=m.id+" · "+m.location;document.getElementById("mt").textContent=m.title;document.getElementById("md").textContent=m.description;document.getElementById("q").textContent=p.role==="WOLF"?m.wolf_question:m.question;document.getElementById("ans").value="";document.getElementById("mr").innerHTML="";endAt=Date.now()+180000;timer=setInterval(tick,250);tick();show("mission")}
function tick(){let x=Math.max(0,endAt-Date.now()),s=Math.ceil(x/1000);document.getElementById("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(!x)clearInterval(timer)}
async function submitAnswer(){if(!current||Date.now()>endAt)return;let p=await me(),g=await settings(),a=document.getElementById("ans").value.trim(),correct=p.role==="WOLF"?current.wolf_answer:current.answer;if(a!==correct){document.getElementById("mr").innerHTML='<div class="notice alert">오답입니다.</div>';return}if(p.role==="SHEEP"){let cs=await comps(g.current_round);if(cs.some(x=>x.mission_id===current.id)){document.getElementById("mr").innerHTML='<div class="notice alert">이미 완료된 미션입니다.</div>';return}await db.from("mission_completions").insert({game_round:g.current_round,mission_id:current.id,player_id:p.id});let after=await comps(g.current_round),ms=await missions();if(ms.length&&after.length>=ms.length)await set({phase:"FINISHED",winner:"SHEEP",notice:"🐑 양이 모든 미션을 완료했습니다!"})}else{await db.from("wolf_attempts").insert({game_round:g.current_round,mission_id:current.id,player_id:p.id});let cs=await comps(g.current_round),count=g.wolf_awakened?2:1;for(let i=0;i<count&&cs.length;i++)await db.from("mission_completions").delete().eq("id",cs[cs.length-1-i].id)}renderPlayer()}
async function set(v){let r=await db.from("game_settings").update(v).eq("id",1);if(r.error)alert(r.error.message)}
function confirmBody(){overlay("☠️","시체 발견","정말 시체를 발견했다고 신고하시겠습니까?","alarm",true)}
async function bodyFound(){closeOverlay();await set({phase:"TRIAL",body_found:true,notice:"☠️ 시체가 발견되었습니다!"})}
async function renderAdmin(){let g=await settings(),p=(await db.from("players").select("*").order("created_at")).data||[],c=await comps(g.current_round),m=await missions();document.getElementById("stats").innerHTML=`<div class="stat">ROUND<b>${g.current_round}</b></div><div class="stat">생존<b>${p.filter(x=>x.status==="ALIVE").length}</b></div><div class="stat">미션<b>${c.length}/${m.length}</b></div><div class="stat">상태<b>${g.phase}</b></div>`;document.getElementById("roundMin").value=g.round_duration_minutes||15;document.getElementById("sheepMin").value=g.sheep_limit_minutes||8;document.getElementById("nfcBtn").textContent="NFC 모드: "+(nfc?"ON":"OFF");document.getElementById("plist").innerHTML=p.map(x=>`<div class="item row"><div><b>${x.name}</b><div class="muted">${x.role} · ${x.status}</div></div><button class="danger" onclick="removePlayer('${x.id}')">퇴장</button></div>`).join("")}
async function startGame(){let p=(await db.from("players").select("*")).data||[];if(!p.length)return alert("참가자가 없습니다.");p.sort(()=>Math.random()-.5);let w=Math.max(1,Math.floor(p.length/5));for(let i=0;i<p.length;i++)await db.from("players").update({role:i<w?"WOLF":"SHEEP",status:"ALIVE"}).eq("id",p[i].id);await set({started:true,phase:"PLAY",notice:"게임이 시작되었습니다.",winner:null,body_found:false,wolf_awakened:false,round_started_at:new Date().toISOString()});renderAdmin()}
async function trial(){await set({phase:"TRIAL",notice:"⚖️ 재판이 시작되었습니다."});renderAdmin()}
async function nextRound(){let g=await settings();await db.from("mission_completions").delete().eq("game_round",g.current_round);await db.from("wolf_attempts").delete().eq("game_round",g.current_round);await set({current_round:g.current_round+1,phase:"PLAY",notice:"ROUND "+(g.current_round+1)+" 시작",winner:null,body_found:false,wolf_awakened:false,round_started_at:new Date().toISOString()});renderAdmin()}
async function forceWin(w){await set({phase:"FINISHED",winner:w,notice:w==="SHEEP"?"🐑 양이 승리했습니다!":"🐺 늑대가 승리했습니다!"})}
async function resetGame(){if(!confirm("게임을 완전히 초기화합니까?"))return;await db.from("mission_completions").delete().gte("id",0);await db.from("wolf_attempts").delete().gte("id",0);await db.from("players").update({role:"UNASSIGNED",status:"ALIVE"}).gte("created_at","1970-01-01");await set({current_round:1,phase:"LOBBY",started:false,notice:"게임 시작을 기다리고 있습니다.",winner:null,body_found:false,wolf_awakened:false,round_started_at:null});renderAdmin()}
async function removePlayer(id){let r=await db.from("players").update({status:"REMOVED"}).eq("id",id);if(r.error)return alert("퇴장 처리 실패: "+r.error.message);renderAdmin()}
async function saveTiming(){await set({round_duration_minutes:+document.getElementById("roundMin").value,sheep_limit_minutes:+document.getElementById("sheepMin").value});alert("저장했습니다.")}
async function sendNotice(){let m=document.getElementById("msg").value.trim();if(!m)return;await db.from("notifications").insert({message:m});await set({notice:"🔔 "+m});document.getElementById("msg").value=""}
function toggleNfc(){nfc=!nfc;document.getElementById("nfcBtn").textContent="NFC 모드: "+(nfc?"ON":"OFF");alert(nfc?"테스트용 NFC 우회 모드가 켜졌습니다.":"실제 NFC 모드입니다.")}
async function awaken(){let g=await settings();if(!g.started||g.phase==="FINISHED"||g.wolf_awakened||!g.round_started_at)return;let t=(Date.now()-new Date(g.round_started_at).getTime())/60000;if(t>=+(g.sheep_limit_minutes||8))await set({wolf_awakened:true,notice:"🐺 늑대가 각성했다"});else if(t>=+(g.round_duration_minutes||15))await set({phase:"TRIAL",notice:"⏰ 라운드 시간이 종료되었습니다."})}
db.channel("wg-settings").on("postgres_changes",{event:"UPDATE",schema:"public",table:"game_settings"},p=>{let g=p.new;if(localStorage.getItem("wg_admin")==="1"){renderAdmin();return}if(g.winner==="SHEEP")overlay("🐑","양의 승리!",g.notice,"win");else if(g.winner==="WOLF")overlay("🐺","늑대의 승리!",g.notice,"win");else if(g.notice!==lastNotice){lastNotice=g.notice||"";if(g.body_found)overlay("☠️","시체가 발견되었습니다!",g.notice,"alarm");else if(g.wolf_awakened)overlay("🐺","늑대가 각성했다",g.notice,"alarm");else if(g.phase==="TRIAL")overlay("⚖️","재판 시작",g.notice);else if(sound)overlay("🔔","관리자 알림",g.notice)}route()}).subscribe();
db.channel("wg-comps").on("postgres_changes",{event:"*","schema":"public","table":"mission_completions"},()=>{if(localStorage.getItem("wg_admin")==="1")renderAdmin();else renderPlayer()}).subscribe();
setInterval(awaken,1000);
if(localStorage.getItem("wg_admin")==="1"){show("admin");renderAdmin()}else if(meId)route();else show("login");
</script></body></html>
